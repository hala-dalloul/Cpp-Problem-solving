name: C++ checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check every standalone solution
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' source; do
            echo "Checking $source"
            if ! g++ -std=c++17 -fsyntax-only -Wall -Wextra -pedantic "$source"; then
              failed=1
            fi
          done < <(find arrays basics data-structures greedy mathematics matrices prefix-sums searching simulation sorting strings two-pointers -type f -name '*.cpp' -print0 | sort -z)
          exit "$failed"

  cmake-configure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake targets
        run: cmake -S . -B build
